name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide enough information to help us evaluate and prioritize it.

  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      description: Which part of the engine would this touch?
      options:
        - "math (linear algebra)"
        - "image (QOI / PPM)"
        - "fiber (coroutines)"
        - "render (framebuffer, rasterizer, camera, clip)"
        - "scene (slot-map scene graph)"
        - "platform (SDL3 window / input)"
        - "build / packaging"
        - "examples"
        - "new subsystem / cross-cutting"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A concise description of the feature in 1-2 sentences.
      placeholder: Add a depth buffer so overlapping triangles are drawn in the correct order.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? Who benefits from it?
      placeholder: |
        Without a depth buffer, the rasterizer draws triangles in submission order,
        so faces of a mesh that should be hidden bleed through the ones in front.
        Any scene with more than one overlapping object renders incorrectly.

        Target user: anyone rendering solid 3D geometry with the engine.
    validations:
      required: true

  - type: textarea
    id: detailed_description
    attributes:
      label: Detailed Description
      description: Describe the desired behavior, API shape, and any edge cases to consider.
      placeholder: |
        A per-pixel depth buffer alongside the color framebuffer:
        - Allocate a `f32` depth buffer in `Framebuffer` sized to width * height
        - During rasterization, interpolate depth and reject fragments that fail the test
        - Clear depth to +inf each frame; expose a `clearDepth` helper

        ```zig
        var fb = try legend.Framebuffer.init(allocator, 640, 480);
        fb.clear(legend.rgb(0, 0, 0));
        fb.clearDepth();
        legend.draw.mesh(&fb, cube, transform, camera); // now depth-tested
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches have you tried or considered?
      placeholder: |
        - Painter's algorithm (sort triangles back-to-front): breaks on interpenetrating geometry
        - Sort whole objects only: cheaper but still wrong within a mesh
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to prior art, related issues, or design notes.
      placeholder: |
        - Z-buffering overview: https://en.wikipedia.org/wiki/Z-buffering
        - Related issue: #45
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low - Nice to have
        - Medium - Would improve my workflow
        - High - Blocking my use case
      default: 0
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement this feature
          required: false
        - label: I can provide test cases
          required: false
        - label: I can help with documentation
          required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: This feature aligns with the project's goals (a software renderer / game engine written in Zig)
          required: false
